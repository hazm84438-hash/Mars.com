name: Public Ubuntu Desktop (No Tailscale)

on:
  workflow_dispatch:

jobs:
  public-linux-vps:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Desktop & RDP
        run: |
          sudo apt update
          sudo apt install -y xfce4 xfce4-goodies xrdp wget curl
          sudo systemctl enable xrdp

      - name: Set Password for Runner User
        run: |
          echo "runner:MR.English2008" | sudo chpasswd

      - name: Install and Configure Ngrok
        run: |
          curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo hkp-server.ubuntu.com --recv-keys 8361E5169ED75971
          curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt update && sudo apt install ngrok
          ngrok config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}

      - name: Start Ngrok Tunnel (Public Port)
        run: |
          # فتح بورت الـ RDP (3389) للعام
          ngrok tcp 3389 --log=stdout > ngrok.log &
          sleep 5
          # استخراج الرابط أو العنوان العام للاتصال
          curl -s http://localhost:4040/api/tunnels | grep -o 'tcp://[^"]*'

      - name: Keep Runner Alive
        run: |
          echo "=========================================="
          echo "VPS is now PUBLIC via Ngrok!"
          echo "Check the Ngrok URL printed above to connect via RDP"
          echo "Username: runner"
          echo "Password: MR.English2008"
          echo "=========================================="

          while true; do
              date
              sleep 300
          done
